# KylinBot Docker Compose Example
# 
# Quick start:
#   1. Copy this file and set your API key
#   2. Run: docker compose up -d
#   3. Access gateway at http://localhost:42617
#
# Compose intentionally uses TCP. The UDS default is for Linux desktop
# single-host runs, not container networking.
#
# For more info: https://github.com/kylinbot-labs/kylinbot

services:
  kylinbot:
    image: <TODO-registry>/openkylin/kylinbot:latest
    # For ARM64 environments where the distroless image exits immediately,
    # switch to the Debian compatibility image instead:
    # image: <TODO-registry>/openkylin/kylinbot:debian
    # Or build locally (distroless, no shell):
    # build: .
    # Or build the Debian variant (includes bash, git, curl):
    # build:
    #   context: .
    #   dockerfile: Dockerfile.debian
    container_name: kylinbot
    restart: unless-stopped
    
    environment:
      # Required: Your LLM provider API key
      - API_KEY=${API_KEY:-}
      # Or use the prefixed version:
      # - KYLINBOT_API_KEY=${KYLINBOT_API_KEY:-}
      
      # Optional: LLM provider (default: openrouter)
      # Options: openrouter, openai, anthropic, ollama
      - PROVIDER=${PROVIDER:-openrouter}
      
      # Allow public bind inside Docker (required for container networking)
      - KYLINBOT_ALLOW_PUBLIC_BIND=true
      # Compose uses TCP because Docker networking is port-based.
      - KYLINBOT_GATEWAY_TRANSPORT=tcp
      # Default gateway port inside container
      - KYLINBOT_GATEWAY_PORT=${KYLINBOT_GATEWAY_PORT:-42617}
      
      # Optional: Model override
      # - KYLINBOT_MODEL=anthropic/claude-sonnet-4-20250514
      
    volumes:
      # Persist workspace and config (must match WORKDIR/HOME in Dockerfile)
      - kylinbot-data:/kylinbot-data
      
    ports:
      # Gateway API port (override HOST_PORT if 42617 is taken)
      - "${HOST_PORT:-42617}:${KYLINBOT_GATEWAY_PORT:-42617}"
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 32M

    # Health check — uses lightweight status instead of full diagnostics.
    # For images with curl, prefer: curl -f http://localhost:42617/health
    healthcheck:
      test: ["CMD", "kylinbot", "status", "--format=exit-code"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  kylinbot-data:
