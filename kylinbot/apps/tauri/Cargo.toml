[package]
name = "kylinbot-desktop"
version = "0.1.0"
edition = "2024"
description = "KylinBot Desktop — Tauri-powered system tray app"
publish = false

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2.0"
tauri-plugin-store = "2.0"
tauri-plugin-single-instance = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
anyhow = "1.0"
http = "1"
bytes = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"

[target.'cfg(unix)'.dependencies]
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio"] }
http-body-util = "0.1"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
futures-util = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }
dirs = "6"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
kylinbot-gateway = { path = "../../crates/kylinbot-gateway" }
kylinbot-config = { path = "../../crates/kylinbot-config" }
tempfile = "3.26"
