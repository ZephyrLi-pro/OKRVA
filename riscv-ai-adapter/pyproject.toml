[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riscv-ai-adapter"
version = "0.2.0"
description = "Lightweight model routing and resource-control plane for RISC-V edge AI"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
riscv-ai-adapterd = "riscv_ai_adapter.server:main"
riscv-ai-adapterctl = "riscv_ai_adapter.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
