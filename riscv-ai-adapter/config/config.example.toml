[server]
host = "127.0.0.1"
port = 18080
request_limit_bytes = 33554432
# Keep empty for loopback-only deployment. For remote access, set token_env,
# allow_remote=true and provide that environment variable through systemd.
token_env = ""
allow_remote = false

# K1 is memory-bandwidth constrained. A group limit of one prevents heavy
# inference workers from contending for the same CPU/TCM/EP resources.
[resource_groups]
heavy_inference = 1
speech_pipeline = 1

[[backends]]
name = "k1-llama"
capability = "chat"
enabled = true
required = true
url = "http://127.0.0.1:18082/v1/chat/completions"
health_url = "http://127.0.0.1:18082/health"
models = ["qwen-local"]
# The northbound alias above is rewritten to the model name expected by llama.cpp.
upstream_model = "qwen-local"
# Optional northbound tool-schema allowlist for small-context local models.
# Empty means pass every KylinBot tool through unchanged.
allowed_tools = []
max_system_prompt_chars = 0
system_prompt_override = ""
timeout_seconds = 600
max_concurrency = 1
acquire_timeout_seconds = 2
priority = 50
resource_group = "heavy_inference"
# Set managed=true and provide command=[...] when the Adapter should own the
# llama-server process. See config/k1.competition.toml for a complete example.
managed = false
restart_on_failure = true
restart_backoff_seconds = 2
max_restarts = 5

[[backends]]
name = "k1-sherpa-asr"
capability = "transcription"
enabled = true
required = true
url = "http://127.0.0.1:18081/v1/audio/transcriptions"
health_url = "http://127.0.0.1:18081/health"
models = ["paraformer-zh-small"]
# The current KylinBot ASR bridge requires a bearer token. Keep the value in
# the process environment instead of writing it into this file.
api_key_env = "KYLINBOT_ASR_TOKEN"
timeout_seconds = 300
max_concurrency = 1
priority = 90
resource_group = "speech_pipeline"

[[backends]]
name = "k1-sherpa-tts"
capability = "speech"
enabled = false
required = false
url = "http://127.0.0.1:18083/v1/audio/speech"
health_url = "http://127.0.0.1:18083/health"
models = ["vits-zh"]
timeout_seconds = 300
max_concurrency = 1
priority = 70
resource_group = "speech_pipeline"

[[backends]]
name = "k1-onnx-ocr"
capability = "ocr"
enabled = false
required = false
url = "http://127.0.0.1:18084/v1/ocr"
health_url = "http://127.0.0.1:18084/health"
models = ["ppocr-mobile"]
timeout_seconds = 120
max_concurrency = 1
priority = 20
resource_group = "heavy_inference"
