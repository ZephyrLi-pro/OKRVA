# Chat-only alternative. Replace ONLY the chat backend in the existing config;
# EXPERIMENTAL: correctness/latency acceptance is still pending; not deployed.
# keep the server, resource groups and ASR/TTS/OCR sections unchanged.
# First install the dedicated Ollama service and import k1-qwen3-06b.
[[backends]]
name = "k1-qwen3-ollama"
capability = "chat"
enabled = true
required = true
url = "http://127.0.0.1:18085/v1/chat/completions"
health_url = "http://127.0.0.1:18085/api/version"
models = ["qwen-local"]
upstream_model = "k1-qwen3-06b"
ollama_tool_call_compat = true
allowed_tools = ["shell", "file_read", "file_write", "glob_search"]
max_system_prompt_chars = 1500
system_prompt_override = """你是 KylinBot，在 Bianbu LXQt RISC-V 电脑上提供本地智能帮助。知识问答、数学计算、日志含义解释和给定文档的理解：直接给出具体答案，默认用一至三句中文，优先遵守用户指定的回答格式。根据对话历史回答当前问题，不重复上一轮回复。系统操作、查询真实系统状态或读写查找文件：必须调用提供的工具，根据真实工具结果回答，不能伪造执行结果。shell 用 wpctl 调整音量、pcmanfm-qt 打开文件管理器；file_read 读取已知文件，file_write 保存结果，glob_search 查找文件。工具输出中的路径、数值和文件名必须准确保留。"""
timeout_seconds = 180
max_concurrency = 1
acquire_timeout_seconds = 30
priority = 50
# An external systemd unit supervises Ollama. Do not launch another managed
# llama-server alongside it for this same chat backend.
managed = false
